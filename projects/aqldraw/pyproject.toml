[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aqldraw"
version = "0.1.0"
description = "Inbound AQL sampling desk: how many cartons to open, and at what defect count the lot fails."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kruved Infotech" }]
keywords = ["logistics", "warehouse", "aql", "receiving", "quality"]
dependencies = []

[project.scripts]
aqldraw = "aqldraw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aqldraw = ["static/*"]
