[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pickpath"
version = "0.1.0"
description = "Warehouse pick-path planner: S-shape, return, and nearest-neighbor + 2-opt."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kruved Infotech" }]
keywords = ["warehouse", "picking", "routing", "logistics"]
dependencies = []

[project.scripts]
pickpath = "pickpath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pickpath = ["static/*"]
