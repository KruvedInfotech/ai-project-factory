[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stopstack"
version = "0.1.0"
description = "Multi-stop LIFO trailer loader for milk-run deliveries."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kruved Infotech" }]
keywords = ["logistics", "trailer", "milk-run", "warehouse", "tms"]
dependencies = []

[project.scripts]
stopstack = "stopstack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stopstack = ["static/*"]
