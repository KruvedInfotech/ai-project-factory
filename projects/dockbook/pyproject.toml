[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dockbook"
version = "0.1.0"
description = "Dock-door appointment booker for inbound and outbound trailers."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kruved Infotech" }]
keywords = ["logistics", "warehouse", "dock", "yard", "appointments"]
dependencies = []

[project.scripts]
dockbook = "dockbook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dockbook = ["static/*"]
