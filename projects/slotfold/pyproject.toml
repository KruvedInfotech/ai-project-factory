[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slotfold"
version = "0.1.0"
description = "Honeycomb location consolidator for warehouse rack slots."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kruved Infotech" }]
keywords = ["warehouse", "slotting", "honeycomb", "consolidation", "wms"]
dependencies = []

[project.scripts]
slotfold = "slotfold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slotfold = ["static/*"]
