[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stagelane"
version = "0.1.0"
description = "Outbound staging-lane planner: carrier-exclusive bays, door match, cutoff, local dock map."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kruved Infotech" }]
keywords = ["warehouse", "staging", "dock", "outbound", "logistics"]
dependencies = []

[project.scripts]
stagelane = "stagelane.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stagelane = ["static/*"]
