[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmatch"
version = "0.1.0"
description = "Cross-dock inbound-to-outbound flow matcher with live unload and staging lanes."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kruved Infotech" }]
keywords = ["warehouse", "cross-dock", "staging", "logistics", "yms"]
dependencies = []

[project.scripts]
flowmatch = "flowmatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flowmatch = ["static/*"]
