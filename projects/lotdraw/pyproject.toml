[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lotdraw"
version = "0.1.0"
description = "FEFO/FIFO lot allocator for outbound warehouse orders."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kruved Infotech" }]
keywords = ["warehouse", "lot", "fefo", "fifo", "allocation"]
dependencies = []

[project.scripts]
lotdraw = "lotdraw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lotdraw = ["static/*"]
