[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shipcut"
version = "0.1.0"
description = "Outbound carrier cutoff clock: which pickup still makes the promise."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kruved Infotech" }]
keywords = ["logistics", "warehouse", "cutoff", "carrier", "shipping"]
dependencies = []

[project.scripts]
shipcut = "shipcut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shipcut = ["static/*"]
